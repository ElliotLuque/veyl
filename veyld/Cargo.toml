[package]
name = "veyld"
version = "0.1.0"
edition = "2024"
description = "El daemon de Veyl: diario de lo que miras, agentes en marcha y órdenes sin modelo"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
png = "0.18"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
signal-hook = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
whisper-rs = "0.16"
zbus = "5"
chrono-tz = "0.10"
ring = "0.17"
base64 = "0.22"
rnix = "0.15"
rowan = "0.17"

[features]
# La transcripción en la GPU: CUDA (NVIDIA) o Vulkan (cualquiera). Sin ninguna, en la CPU.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = "thin"
strip = true
